<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guarda Frases</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>📝 Guarda tus Frases</h1>
        <p>Escribe una frase o texto largo y guárdala</p>
        
        <form id="phraseForm">
            <textarea id="phraseInput" placeholder="Escribe aquí tu frase larga..." rows="8" maxlength="5000"></textarea>
            <div id="charCounter" class="char-counter">0 / 5000</div>
            <button type="submit" id="submitBtn">Guardar Frase</button>
        </form>

        <div id="message" class="message"></div>

        <div class="random-section">
            <div class="random-header">
                <h2>💬 Frase del momento</h2>
                <span id="randomCountdown" class="random-countdown">30s</span>
            </div>
            <div id="randomPhrase" class="random-card">
                <p class="random-text">Cargando...</p>
            </div>
        </div>

        <h2>Todas las Frases</h2>
        <div id="phrasesList" class="phrases-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
